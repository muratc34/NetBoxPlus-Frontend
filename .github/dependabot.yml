# Update pull requests against master. Versions are pinned exactly, so every update is a pull request;
# a release must be a day old first, like pnpm's minimumReleaseAge.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 10
    groups:
      react-next:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom', 'next', '@next/*']
      build-tools:
        patterns: ['vite', '@vitejs/*', 'turbo', 'typescript', 'tailwindcss', '@tailwindcss/*']
      lint-format:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint', 'globals', 'prettier']
      testing:
        patterns: ['vitest', 'jsdom', '@testing-library/*']
      openapi:
        patterns: ['openapi-typescript', 'openapi-fetch']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      actions:
        patterns: ['*']

  - package-ecosystem: docker
    directories: ['/apps/web', '/apps/admin']
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    groups:
      images:
        patterns: ['*']
